<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Star Model | Akasha Chronicles</title>
  <meta name="description" content="Interactive 3D star model hosted as a separate page to keep the Akasha Chronicles homepage fast.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: rgba(15, 23, 42, 0.86);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #a9b5c8;
      --accent: #f59e0b;
      --accent-2: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(7,11,18,0.42), rgba(7,11,18,0.96)),
        url('assets/solar_uplink.webp') center / cover fixed,
        var(--bg);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      padding: 18px clamp(16px, 4vw, 44px);
      background: rgba(7, 11, 18, 0.76);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand {
      min-width: 0;
    }
    .brand span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    h1 {
      margin: 2px 0 0;
      font-size: clamp(22px, 4vw, 38px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }
    .btn.primary {
      border-color: rgba(245,158,11,0.48);
      background: linear-gradient(135deg, var(--accent), #ef4444);
      color: #111827;
    }
    main {
      padding: clamp(14px, 3vw, 28px);
    }
    .model-shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #020617;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
    }
    iframe {
      width: 100%;
      height: min(78vh, 820px);
      min-height: 560px;
      border: 0;
      display: block;
      background: #020617;
    }
    .note {
      max-width: 980px;
      margin: 14px auto 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel);
      line-height: 1.55;
    }
    @media (max-width: 720px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
      iframe {
        height: 72vh;
        min-height: 460px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>Akasha Chronicles // 3D Research Interface</span>
      <h1>Interactive Star Model</h1>
    </div>
    <a class="btn" href="index.html#star">Back to main site</a>
  </header>
  <main>
    <div class="model-shell">
      <iframe title="3D Star Model" src="https://luciferprosun.github.io/Star-3d-model-/Model.html" loading="eager" allowfullscreen></iframe>
    </div>
    <p class="note">This page intentionally loads the heavy WebGL model separately from the homepage. If performance drops, close this tab and return to the main site.</p>
  </main>
</body>
</html>
